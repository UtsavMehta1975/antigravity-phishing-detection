<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ParallelAI Guard</title>
  <style>
    body { width: 350px; font-family: 'Inter', sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
    h2 { font-size: 1.2rem; color: #00f2fe; margin-top: 0; text-align: center; }
    #url-display { word-break: break-all; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; color: #aaa; }
    .btn { display: block; width: 100%; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border: none; color: #fff; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .btn:hover { box-shadow: 0 0 15px rgba(0,242,254,0.5); }
    #result { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
    .safe { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
    .malicious { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
    .loading { text-align: center; color: #00f2fe; display: none; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>ParallelAI Phishing Guard</h2>
  <div id="url-display">Fetching URL...</div>
  <button id="scan-btn" class="btn">Scan Current Page</button>
  <div id="loading" class="loading">Analyzing with AI...</div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
